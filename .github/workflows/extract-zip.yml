

name: Extract D-Compress Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: findzip
        run: |
          ZIP_PATH=$(find . -maxdepth 2 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)
          echo "Found ZIP: $ZIP_PATH"
          test -n "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        run: |
          unzip -o "${{ steps.findzip.outputs.zip_path }}" -d . -x ".github/*" "./.github/*"
          echo "ZIP extraction completed"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract D-Compress project"
          git push
          
          
