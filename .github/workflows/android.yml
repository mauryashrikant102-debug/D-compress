
name: D-Compress Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "D-Compress repository checked"
          ls -la
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "Android project files are not added yet."
            exit 1
          fi
          
